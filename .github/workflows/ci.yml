name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs execute the nightly jobs (on-demand live-DB + PWA rehearsal).
  workflow_dispatch:
  # 02:30 UTC nightly — nightly-live-db (live-Postgres suites + e2e-smoke) and
  # nightly-pwa (device matrix) run in parallel; lint/unit/e2e/build skip on
  # schedule via their event gates.
  schedule:
    - cron: "30 2 * * *"

concurrency:
  # Lane per event type: the nightly (schedule/dispatch) must never cancel an
  # in-progress push run (which ends in a production deploy) or vice versa.
  # Push/PR behavior is unchanged — their refs already differed.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # npm ≥ 11 is required to honor the *scoped* overrides in package.json
  # (xcode→uuid, vercel→{tar,path-to-regexp,undici,js-yaml,minimatch,
  # smol-toml,ajv,@tootallnate/once}). npm 10 — bundled with Node 22 —
  # silently ignores them and reinstalls the vulnerable versions. Each npm
  # major also rejects the other's lockfile, so the lockfile committed with
  # npm 12 must be installed by npm ≥ 12 everywhere (`npm ci` fails fast if
  # not, as CI 36116092200 proved).
  NPM_VERSION: "12.0.2"

jobs:
  # ─── Lint & Typecheck ───
  # Gated to push/PR so a scheduled nightly runs ONLY the live-Postgres job
  # (no duplicated lint/unit/e2e/build cost on the 02:30 UTC main run).
  lint:
    name: Lint & Typecheck (enforced)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # Enforced, not advisory: `scripts/**` is outside ESLint's reach
      # (eslint.config ignores it), so without this gate a script with a syntax
      # error or a dead import ships unnoticed — which is exactly how
      # strip-tsconfig-dist-entries.mjs sat broken for its whole life behind
      # `node scripts/… || true`.
      - name: Scripts (parse + import graph)
        run: npm run check:scripts

      - name: Docs links
        run: npm run check:docs-links

      - name: Diagrams (validate)
        run: npm run validate:diagrams

      - name: Docs manual (generate)
        run: npm run docs:manual
        continue-on-error: true

  # ─── Unit Tests ───
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          echo 'DEMO_MODE=true' >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npx vitest run --reporter=verbose --exclude '**/e2e-smoke.test.ts' --exclude '**/e2e-critical-flows.test.ts' --exclude '**/*-prisma.test.ts'

  # ─── Playwright E2E (production build) ───
  e2e:
    name: E2E (Playwright, production build)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup environment
        run: |
          cp .env.example .env
          # DEMO_MODE=true is the explicit demo-session opt-in (see
          # demoSessionAllowed): the production server the webServer boots
          # signs Playwright's wa_session cookies in — keyless, database-free.
          echo 'DEMO_MODE=true' >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Playwright tests against a production build
        # PW_PROD boots `npm run build:prod && next start` (production server)
        # instead of `next dev`. The dev server crashes under the load of 289
        # tests x 4 workers (Error: aborted / destination stream closed), which
        # cascades into "element not found" on every subsequent test. The
        # nightly-pwa job already uses PW_PROD=1 and is stable.
        # NEXT_DISABLE_STANDALONE lets `next start` serve the build (standalone
        # output refuses it); PW_PORT must match the config's webServer port.
        # --workers=4 pins the config's CI default explicitly: 4 headless
        # Chromiums + the production Next server fit ubuntu-latest's 2 vCPU /
        # 7 GB with headroom — more workers there means CPU/RAM contention and
        # flaky timing-sensitive assertions, not speed. Change the config's
        # `workers` default AND this pin together.
        run: npx playwright test --workers=4
        env:
          CI: "true"
          PW_PORT: "3001"
          PW_PROD: "1"
          NEXT_DISABLE_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Nightly Live-Postgres (scheduled + manual) ───
  # Runs the suites the PR CI excludes (tests/*-prisma.test.ts + the e2e-smoke
  # matrix) against REAL databases. The Prisma suites and db:smoke use the
  # primary service database. Critical HTTP flows get a second disposable
  # database plus an isolated relative NEXT_DIST_DIR, so server reads/writes
  # and Next caches cannot contaminate the data-layer smoke or a preview. The
  # e2e-smoke matrix starts its own demo servers and artifacts afterward.
  nightly-live-db:
    name: Nightly Live-Postgres (prisma + e2e-smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workers_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Setup environment (real mode)
        run: |
          cp .env.example .env
          # Real-data contract (see realAuthEnabled / realDataEnabled):
          # DEMO_MODE=false + DATABASE_URL + a non-placeholder AUTH_SECRET.
          sed -i 's|DATABASE_URL=.*|DATABASE_URL="postgresql://postgres:postgres@localhost:5432/workers_arena_test?schema=public"|' .env
          sed -i 's|DEMO_MODE=.*|DEMO_MODE="false"|' .env
          sed -i 's|AUTH_SECRET=.*|AUTH_SECRET="nightly-ci-live-db-secret-0123456789abcdef"|' .env
          sed -i 's|AUTH_URL=.*|AUTH_URL="http://localhost:3001"|' .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: |
          npx prisma migrate status
          npx prisma migrate status 2>/dev/null | grep -q 'Database schema is up to date'

      - name: Seed database
        run: npm run db:seed

      - name: Data-layer smoke (db:smoke)
        run: npm run db:smoke

      - name: Run live-Postgres prisma suites
        run: npx vitest run tests/prisma-repo.test.ts tests/booking-email-chain-prisma.test.ts tests/campaign-email-chain-prisma.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workers_arena_test?schema=public
          DEMO_MODE: "false"
          AUTH_SECRET: nightly-ci-live-db-secret-0123456789abcdef

      - name: Create isolated critical-flows database
        run: |
          # Keep HTTP critical flows away from the database mutated by db:smoke
          # and the Prisma suites. The service container starts with the primary
          # database already present; this second database is disposable.
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE workers_arena_critical"
          export CRITICAL_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/workers_arena_critical?schema=public"
          DATABASE_URL="$CRITICAL_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$CRITICAL_DATABASE_URL" npx prisma migrate status
          DATABASE_URL="$CRITICAL_DATABASE_URL" npx prisma migrate status 2>/dev/null | grep -q 'Database schema is up to date'
          DATABASE_URL="$CRITICAL_DATABASE_URL" DEMO_MODE=false npm run db:seed

      - name: Start isolated real-data dev server (for e2e-critical-flows)
        run: |
          set -euo pipefail
          CRITICAL_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/workers_arena_critical?schema=public"
          CRITICAL_DIST_DIR=".data/.next-e2e-critical-${GITHUB_RUN_ID}"
          export CRITICAL_DATABASE_URL CRITICAL_DIST_DIR
          # Use a dedicated process group so cleanup cannot leave a Next child
          # server listening on 3001 after the job step exits.
          setsid npx next dev -p 3001 > /tmp/next-dev-nightly.log 2>&1 &
          SERVER_PID=$!
          # Persist the process/artifact handles for the cleanup step. Do not
          # trap here: GitHub uses a fresh shell for the next step, and the
          # critical suite must keep this server alive between steps.
          echo "CRITICAL_SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          echo "CRITICAL_DIST_DIR=$CRITICAL_DIST_DIR" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "isolated critical-flows server ready (attempt $i)"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/api/health
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workers_arena_critical?schema=public
          DEMO_MODE: "false"
          NEXT_DIST_DIR: .data/.next-e2e-critical-${{ github.run_id }}
          ADMIN_ACTIVITY_FILE: .data/.next-e2e-critical-${{ github.run_id }}/activity.json
          PUSH_STORE_FILE: .data/.next-e2e-critical-${{ github.run_id }}/push-subscriptions.json

      - name: Critical flows against isolated real data
        run: npx vitest run tests/e2e-critical-flows.test.ts
        env:
          FLOWS_BASE_URL: http://localhost:3001
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workers_arena_critical?schema=public
          DEMO_MODE: "false"

      - name: Stop critical-flows server and remove isolated artifacts
        if: always()
        run: |
          if [ -n "${CRITICAL_SERVER_PID:-}" ]; then
            kill -- -"$CRITICAL_SERVER_PID" 2>/dev/null || kill "$CRITICAL_SERVER_PID" 2>/dev/null || true
            # The dying dev server keeps writing into its dist dir for a
            # moment after the kill; `rm -rf` raced that write and failed
            # with "Directory not empty". Wait (bounded) for the process
            # group to actually exit so the rm below sees a quiet tree.
            # This adds no masking — every failure below stays fatal.
            for i in $(seq 1 20); do
              kill -0 -- -"$CRITICAL_SERVER_PID" 2>/dev/null || break
              sleep 0.5
            done
          fi
          rm -rf "${CRITICAL_DIST_DIR:-.data/.next-e2e-critical-${GITHUB_RUN_ID}}"
          # No `|| true`: this script once swallowed a SyntaxError on every run
          # because of exactly that mask. It is covered by `check:scripts` and
          # tested, so a failure here is real news.
          node scripts/strip-tsconfig-dist-entries.mjs

      - name: E2E hydration smoke (dev + prod matrix)
        # Runs its own Chrome-driven dev+prod matrix against isolated servers.
        # Needs Chrome on the runner: ubuntu-latest ships Google Chrome.
        run: npx vitest run tests/e2e-smoke.test.ts
        env:
          E2E_AUTOCLEAN: "1"
          E2E_DUMP_NOTES: "1"

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-live-db-logs
          path: /tmp/next-dev-nightly.log
          retention-days: 7
          if-no-files-found: ignore

  # ─── Nightly PWA Device Matrix (scheduled + manual) ───
  # The push/PR e2e job already runs pwa-device-matrix.spec.ts on every PR,
  # but scheduled runs execute ONLY nightly-live-db — so viewport/offline
  # regressions never surfaced on schedule. This job closes that gap (hence
  # the schedule/dispatch gate — unlike the live-DB suites, the matrix needs
  # no PR-side coverage from a dedicated job). It runs in parallel with
  # nightly-live-db: the spec exercises public pages only and writes nothing
  # to the database, so it shares no state with the DB job, and the two fit
  # a night on free runners side by side.
  # Production build (PW_PROD), not dev: the 35-URL SW precache compiles
  # on demand under `next dev` (cold installs take minutes), while static
  # prod assets precache in seconds — and CI's e2e already validates against
  # prod, so this matches the mode where offline behavior actually ships.
  nightly-pwa:
    name: Nightly PWA Device Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup environment
        run: |
          cp .env.example .env
          # The webServer's production server signs Playwright's demo cookies
          # (see demoSessionAllowed) — same contract as the push/PR e2e job.
          echo 'DEMO_MODE=true' >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run PWA device matrix against a production build
        # --workers=4: same sizing contract as the push/PR e2e job above —
        # ubuntu-latest (2 vCPU / 7 GB) tops out at 4 parallel Chromiums plus
        # the production server; the config's CI default mirrors it, but the
        # workflow pins it so runner sizing stays explicit and predictable.
        run: npx playwright test tests/playwright/pwa-device-matrix.spec.ts --workers=4
        env:
          CI: "true"
          PW_PORT: "3001"
          PW_PROD: "1"
          NEXT_DISABLE_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pwa-report
          path: playwright-report/
          retention-days: 7

  # ─── Build ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          echo 'DEMO_MODE=true' >> .env
          echo 'NEXT_PUBLIC_APP_URL=https://workers-arena.vercel.app' >> .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://workers-arena.vercel.app

      - name: Upload Sentry source maps
        if: success()
        run: node scripts/sentry-upload.mjs
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        continue-on-error: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 3

  # ─── Deploy Preview (PRs only) ───
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (preview)
        uses: amondnet/vercel-action@v25
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --pre

  # ─── Deploy Production (main branch only) ───
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://workers-arena.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm pinned — the scoped overrides in package.json are honored only by npm ≥ 11)
        run: |
          npm install -g npm@${NPM_VERSION}
          npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          echo 'DEMO_MODE=true' >> .env
          # Keep the canonical URL deterministic in the checked-out build. The
          # Vercel project may contain an unset/legacy value; `vercel pull`
          # writes it into .env.production.local and Next loads that file over
          # .env unless the build environment explicitly wins.
          sed -i 's|^NEXT_PUBLIC_APP_URL=.*|NEXT_PUBLIC_APP_URL="https://workers-arena.vercel.app"|' .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_APP_URL: https://workers-arena.vercel.app
          APP_URL: https://workers-arena.vercel.app
          NEXT_TELEMETRY_DISABLED: "1"
