# Dependency updates. Security updates are on in the repo settings; these are
# the routine version bumps, grouped so they arrive as a few PRs a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps together; majors (Next, React, Prisma…) stay
      # separate so each can be reviewed on its own.
      npm-minor-patch:
        update-types: [minor, patch]
    # Capacitor's native packages must move together with the committed
    # ios/ and android/ shells (cap sync), so they're upgraded by hand.
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: [version-update:semver-major]
      # Prisma 7 changes how the client is generated and configured, and
      # ESLint 10 is not yet supported by eslint-config-next. Both are planned
      # upgrades, not routine bumps (they failed CI as PRs #31 / #32).
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
